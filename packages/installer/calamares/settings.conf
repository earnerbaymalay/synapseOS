# Calamares Configuration for SynapseOS (x86-64-v3 / BORE / AI-Native)
---
modules-search: [ local ]

instances:
  - id: cleanup
    module: shellprocess
    config: shellprocess@cleanup.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - shellprocess@cleanup
      - fstab
      - locale
      - keyboard
      - localecfg
      - luksbootkeyfile
      - initcpiocfg
      - initcpio
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - bootloader
      - umount
  - show:
      - finished

branding: synapseos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
