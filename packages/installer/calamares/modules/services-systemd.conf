#
# SynapseOS Calamares Systemd Services Configuration
---
services:
  - name: "sddm"
    mandatory: true
  - name: "NetworkManager"
    mandatory: true
  - name: "systemd-resolved"
    mandatory: true
  - name: "firewalld"
    mandatory: true
  - name: "ananicy-cpp"
    mandatory: false
  - name: "ollama"
    mandatory: false
  - name: "synapse"
    mandatory: true
  - name: "fstrim.timer"
    mandatory: false

targets:
  - name: "graphical"
    mandatory: true

disable:
  - name: "avahi-daemon"
  - name: "avahi-daemon.socket"
