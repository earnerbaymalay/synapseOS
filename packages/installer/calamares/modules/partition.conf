#
# SynapseOS Calamares Partition Module Configuration
---
efiSystemPartition:     "/boot/efi"
efiSystemPartitionSize: 512M
efiSystemPartitionName: EFI

userSwapChoices:
    - none
    - small
    - suspend
    - file

initialSwapChoice: none
 swapPartitionName: swap

# Default to Btrfs with zstd compression; Ext4 with noatime supported as secondary choice
defaultFileSystemType:  "btrfs"
availableFileSystemTypes:  ["btrfs", "ext4", "xfs", "f2fs"]

enableLuksAutomatedPartitioning: true
luksGeneration: luks2

btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /.snapshots
      subvolume: /@snapshots
    - mountPoint: /var/log
      subvolume: /@var_log

mountOptions:
    - filesystem: default
      options: [ defaults, noatime ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
    - filesystem: btrfs
      options: [ defaults, noatime, compress=zstd:3, space_cache=v2, ssd, discard=async ]
    - filesystem: ext4
      options: [ defaults, noatime, commit=60 ]
