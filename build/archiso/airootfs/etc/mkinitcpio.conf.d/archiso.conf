# Live ISO only (archiso releng hooks, minus PXE: no nbd/nfs helpers shipped). Calamares shellprocess@cleanup removes this
# drop-in on install so the installed initramfs is built from /etc/mkinitcpio.conf.
HOOKS=(base udev microcode modconf kms memdisk archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
