DEFAULT select
PROMPT 0
TIMEOUT 50

UI vesamenu.c32
MENU TITLE SynapseOS Live Boot Menu (PS2 Cyber Blue Edition)
MENU COLOR border       30;44   #4000a8ff #00000000 std
MENU COLOR title        1;36;44 #ff00a8ff #00000000 std
MENU COLOR sel          7;37;40 #e0ffffff #20cba6f7 all
MENU COLOR unsel        37;44   #90cdd6f4 #00000000 std

LABEL select
MENU LABEL Boot SynapseOS Live (x86_64, linux-cachyos)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% quiet splash loglevel=3 systemd.show_status=auto rd.udev.log_level=3 cow_spacesize=4G

LABEL ram
MENU LABEL Boot SynapseOS Live (Copy to RAM)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% copytoram quiet splash loglevel=3

LABEL reboot
MENU LABEL Reboot System
COM32 reboot.c32

LABEL poweroff
MENU LABEL Power Off
COM32 poweroff.c32
