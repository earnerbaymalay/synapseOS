# ==============================================================================
# /etc/xdg/picom.conf — SynapseOS Translucent Glass Cyberdeck Compositor
# Aesthetic: Obsidian Crust (#11111b), Frosted Dual-Kawase Glass, Smooth Fades
# ==============================================================================

# --- Backend & VSync ---
backend = "glx";
vsync = true;
use-damage = true;
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
unredir-if-possible = true;

# --- Rounded Corners (Omarchy / Cyberdeck Geometry) ---
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'tooltip'",
  "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'menu'",
  "class_g = 'xfce4-panel'",
  "class_g = 'Polybar'",
  "class_g = 'mpv'",
  "_GTK_FRAME_EXTENTS@:c",
  "fullscreen"
];

# --- Translucent Glass Opacity Hierarchy ---
active-opacity = 0.94;
inactive-opacity = 0.88;
frame-opacity = 0.92;
inactive-opacity-override = false;

opacity-rule = [
  "100:class_g = 'mpv'",
  "100:class_g = 'vlc'",
  "100:class_g = 'feh'",
  "100:class_g = 'Gimp'",
  "100:class_g = 'galculator'",
  "100:class_g = 'Calamares'",
  "100:class_g = 'calamares'",
  "100:fullscreen",
  "94:class_g = 'kitty' && focused",
  "88:class_g = 'kitty' && !focused",
  "94:class_g = 'foot' && focused",
  "88:class_g = 'foot' && !focused",
  "98:class_g = 'Synapse-hud'",
  "98:class_g = 'synapse-hud'",
  "95:class_g = 'Rofi'"
];

# --- Dual-Kawase Frosted Glass Blur ---
blur: {
  method = "dual_kawase";
  strength = 6;
  background = true;
  background-frame = false;
  background-fixed = false;
};

blur-background-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dnd'",
  "class_g = 'mpv'",
  "class_g = 'slop'",
  "_GTK_FRAME_EXTENTS@:c",
  "fullscreen"
];

# --- Shadows ---
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.55;
shadow-offset-x = -15;
shadow-offset-y = -15;
shadow-color = "#11111b";

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g = 'mpv'",
  "class_g = 'slop'",
  "class_g = 'Rofi'",
  "class_g = 'Synapse-hud'",
  "class_g = 'synapse-hud'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'",
  "_GTK_FRAME_EXTENTS@:c",
  "fullscreen"
];

# --- Smooth Fading (320ms) ---
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 5;

fade-exclude = [
  "class_g = 'mpv'"
];

# --- Window Type Rules ---
wintypes: {
  tooltip = { fade = true; shadow = false; opacity = 0.96; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.96; shadow = false; };
  dropdown_menu = { opacity = 0.96; shadow = false; };
  menu = { shadow = false; };
};
