# ==============================================================================
# /etc/xdg/picom.conf — SynapseOS Translucent Glass Cyberdeck Compositor
# ==============================================================================

# --- Backend & VSync ---
backend = "glx";
vsync = true;
use-damage = true;
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
unredir-if-possible = true;

# --- Rounded Corners (Omarchy / Cyberdeck Geometry) ---
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'xfce4-panel'",
  "class_g = 'Polybar'",
  "class_g = 'mpv'",
  "fullscreen"
];

# --- Translucent Glass Opacity Hierarchy ---
active-opacity = 0.94;
inactive-opacity = 0.88;
frame-opacity = 0.92;
inactive-opacity-override = false;

opacity-rule = [
  "100:class_g = 'mpv'",
  "100:class_g = 'vlc'",
  "100:class_g = 'feh'",
  "100:class_g = 'Gimp'",
  "100:name *= 'PS2 System Boot'",
  "100:name *= 'PS2 XFCE Startup'",
  "100:fullscreen",
  "94:class_g = 'kitty' && focused",
  "88:class_g = 'kitty' && !focused",
  "95:class_g = 'Rofi'"
];

# --- Dual-Kawase Frosted Glass Blur ---
blur: {
  method = "dual_kawase";
  strength = 6;
  background = true;
  background-frame = false;
  background-fixed = false;
};

blur-background-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dnd'",
  "class_g = 'mpv'",
  "class_g = 'slop'",
  "_GTK_FRAME_EXTENTS@:c",
  "fullscreen"
];

# --- Shadows ---
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.55;
shadow-offset-x = -15;
shadow-offset-y = -15;
shadow-color = "#00040d";

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g = 'mpv'",
  "_GTK_FRAME_EXTENTS@:c",
  "fullscreen"
];

# --- Smooth Fading (320ms parity with PS2 SDDM handoff) ---
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 5;

fade-exclude = [
  "class_g = 'mpv'",
  "name *= 'PS2 System Boot'"
];

# --- Window Type Rules ---
wintypes: {
  tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.94; };
  dropdown_menu = { opacity = 0.94; };
};
