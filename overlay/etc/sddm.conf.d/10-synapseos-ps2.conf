# /etc/sddm.conf.d/10-synapseos-ps2.conf
# SynapseOS Boot & Login Configuration:
# Seamless handoff from Xsetup (ps2-system-boot) to the ps2-xfce Qt6 greeter.

[Theme]
Current=ps2-xfce
CursorTheme=Catppuccin-Mocha-Mauve-Cursors
Font=JetBrainsMono Nerd Font,10,-1,5,50,0,0,0,0,0

[X11]
DisplayCommand=/usr/share/sddm/scripts/Xsetup-synapseos
MinimumVT=7
ServerArguments=-nolisten tcp

[Users]
RememberLastUser=true
RememberLastSession=true
HideUsers=git,ollama,synapse-daemon
