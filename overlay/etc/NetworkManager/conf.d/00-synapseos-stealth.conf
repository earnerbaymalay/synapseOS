# /etc/NetworkManager/conf.d/00-synapseos-stealth.conf
# SynapseOS Prime Directive: Mandatory Hardware MAC Randomization & IPv6 Privacy
# Ensures physical hardware MAC addresses are never leaked during scanning or sessions.

[device]
wifi.scan-rand-mac-address=yes

[connection]
wifi.cloned-mac-address=random
ethernet.cloned-mac-address=random
ipv6.ip6-privacy=2
connection.mdns=0
connection.llmnr=0

[main]
dns=systemd-resolved
systemd-resolved=true
