# /etc/systemd/system/ollama.service.d/override.conf
# SynapseOS Local LLM Engine Tuning:
# - 24h resident model keep-alive for zero cold-start latency
# - Single-queue concurrency protection to prevent RAM/VRAM exhaustion
# - Constrained to physical cores (4 threads) to prevent cache thrashing

[Service]
Environment="OLLAMA_HOST=127.0.0.1:11434"
Environment="OLLAMA_KEEP_ALIVE=24h"
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_NUM_THREADS=4"
Environment="OLLAMA_ORIGINS=*"
Environment="OLLAMA_FLASH_ATTENTION=1"
