# ==============================================================================
# /etc/sysctl.d/99-synapseos.conf
# SynapseOS Kernel Tuning: ZRAM/Memory Subsystem, BBR Networking & Stealth Posture
# ==============================================================================

# --- 1. ZRAM & Virtual Memory Optimization (CachyOS / LLM Workload Profile) ---
# Aggressive swapping to ultra-fast zstd-compressed ZRAM block device
vm.swappiness = 180
# Disable swap readahead clustering (zero seek latency on RAM-backed ZRAM)
vm.page-cluster = 0
# Retain inode/dentry caches longer for rapid codebase traversal & git/ripgrep
vm.vfs_cache_pressure = 50
# Smooth asynchronous writeback to prevent SSD I/O stalls during heavy builds
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
# Increase max memory map count for large LLM tensors, databases & compilers
vm.max_map_count = 2147483642

# --- 2. Low-Latency TCP BBR Congestion Control ---
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1

# --- 3. Prime Directive Network Stealth & Hardening ---
# Ignore all unsolicited ICMP echo requests (stealth against ping sweeps)
net.ipv4.icmp_echo_ignore_all = 1
net.ipv6.icmp.echo_ignore_all = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1

# RFC 4941 IPv6 Privacy Extensions (prefer temporary randomized addresses)
net.ipv6.conf.all.use_tempaddr = 2
net.ipv6.conf.default.use_tempaddr = 2

# Strict Reverse Path Filtering & Spoof Protection
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Disable ICMP redirects and source routing
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0

# TCP SYN Flood Protection
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1

# Kernel Pointer & dmesg Hardening
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
