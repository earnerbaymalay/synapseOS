#
# /etc/pacman.conf — SynapseOS Package Manager Configuration
#
# See the pacman.conf(5) manpage for option and repository directives

[options]
HoldPkg     = pacman glibc
Architecture = auto

# Pacman Aesthetics & Performance
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 10
ILoveCandy
DownloadUser = alpm

# Security & Signature Verification
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

#
# Repositories
#
# The [synapseos] overlay repository takes precedence for Synapse AI core daemons,
# cyberdeck desktop packages, and distribution defaults.
# The [cachyos-v3] and [cachyos] repositories provide x86-64-v3 AVX2/BMI2 optimized
# packages and the linux-cachyos BORE scheduler kernel.
#

[synapseos]
SigLevel = Optional TrustAll
Server = https://repo.synapseos.org/$arch
Server = file:///var/cache/synapseos/repo

[cachyos-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-core-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-extra-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
