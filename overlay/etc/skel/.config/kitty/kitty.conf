# ==============================================================================
# ~/.config/kitty/kitty.conf — SynapseOS Cyberdeck Terminal Configuration
# ==============================================================================

# --- Window Layout & Geometry ---
remember_window_size        no
initial_window_width        110c
initial_window_height       32c
window_padding_width        12
confirm_os_window_close     0
enable_audio_bell           no

# --- Typography (JetBrainsMono Nerd Font) ---
font_family                 JetBrainsMono Nerd Font Mono
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
font_size                   10.5
adjust_line_height          0
adjust_column_width         0
disable_ligatures           never

# --- Translucent Glass & Cursor ---
background_opacity          0.88
dynamic_background_opacity  yes
cursor_shape                block
cursor_blink_interval       0.5

# --- Remote Control & IPC (Required for Live Quickfire Theme Switching) ---
allow_remote_control        yes
listen_on                   unix:@kitty

# --- PS2 Cyber Blue / Catppuccin Mocha Mauve Hybrid Base Palette ---
# Note: Live overridden via `quickfire-theme` writing to quickfire-colors.conf
background                  #00091a
foreground                  #e6f3ff
selection_background        #0b2550
selection_foreground        #00f0ff
cursor                      #00f0ff
cursor_text_color           #00091a
url_color                   #cba6f7

# Black / Deep Navy
color0                      #00091a
color8                      #4d7a9e

# Red / Crimson Neon
color1                      #ff3366
color9                      #f38ba8

# Green / Cyber Emerald
color2                      #00e676
color10                     #a6e3a1

# Yellow / PS2 Gold
color3                      #ffd700
color11                     #f9e2af

# Blue / PS2 Electric Blue
color4                      #00b4d8
color12                     #00f0ff

# Magenta / Catppuccin Mauve
color5                      #cba6f7
color13                     #c77dff

# Cyan / Liquid Chrome Cyan
color6                      #00f0ff
color14                     #94e2d5

# White / Ice Silver
color7                      #cdd6f4
color15                     #ffffff

# --- Dynamic Quickfire Theme Include ---
include quickfire-colors.conf
