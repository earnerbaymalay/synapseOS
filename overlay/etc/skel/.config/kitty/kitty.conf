# ==============================================================================
# ~/.config/kitty/kitty.conf — SynapseOS Cyberdeck Terminal Configuration
# ==============================================================================

# --- Window Layout & Geometry ---
remember_window_size        no
initial_window_width        110c
initial_window_height       32c
window_padding_width        12
confirm_os_window_close     0
enable_audio_bell           no

# --- Typography (JetBrainsMono Nerd Font) ---
font_family                 JetBrainsMono Nerd Font Mono
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
font_size                   10.5
adjust_line_height          0
adjust_column_width         0
disable_ligatures           never

# --- Translucent Glass & Cursor ---
background_opacity          0.88
dynamic_background_opacity  yes
cursor_shape                block
cursor_blink_interval       0.5

# --- Remote Control & IPC (Required for Live Quickfire Theme Switching) ---
allow_remote_control        yes
listen_on                   unix:@kitty

# --- Catppuccin Mocha Mauve / Liquid Silver Chrome / Obsidian Crust Palette ---
# Note: Live overridden via `quickfire-theme` writing to quickfire-colors.conf
background                  #11111b
foreground                  #cdd6f4
selection_background        #1e1e2e
selection_foreground        #cba6f7
cursor                      #cba6f7
cursor_text_color           #11111b
url_color                   #cba6f7

# Black / Obsidian Crust & Surface
color0                      #11111b
color8                      #585b70

# Red / Catppuccin Red
color1                      #f38ba8
color9                      #f38ba8

# Green / Catppuccin Green
color2                      #a6e3a1
color10                     #a6e3a1

# Yellow / Catppuccin Yellow
color3                      #f9e2af
color11                     #f9e2af

# Blue / Catppuccin Lavender
color4                      #89b4fa
color12                     #b4befe

# Magenta / Catppuccin Mauve
color5                      #cba6f7
color13                     #f5c2e7

# Cyan / Catppuccin Teal
color6                      #94e2d5
color14                     #94e2d5

# White / Liquid Silver Chrome
color7                      #cdd6f4
color15                     #a6adc8

# --- Dynamic Quickfire Theme Include ---
include quickfire-colors.conf
